[project]
name = "transcript-sync"
description = "MCP server for secure, per-user access to Microsoft Teams transcripts"
version = "0.1.0"
readme = "README.md"
license = "MIT"
authors = [{ name = "Daniel Pinto" }]
keywords = ["mcp", "microsoft-graph", "microsoft-teams", "transcripts"]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10,<2",
    "msal>=1.32",
    "requests>=2.32",
    "keyring>=25",
    "cryptography>=42",  # direct dep of scripts/create_entra_app.py
    "pyjwt>=2.10",       # cloud: Entra JWT validation
    "uvicorn>=0.30",     # cloud: streamable-HTTP transport
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
transcript-sync = "transcript_sync.server:main"
transcript-sync-cloud = "transcript_sync.cloud.server:main"

[project.urls]
Homepage = "https://github.com/Mouxy/teams-transcript-mcp"
Repository = "https://github.com/Mouxy/teams-transcript-mcp"
Issues = "https://github.com/Mouxy/teams-transcript-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_sync"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Field 'lifespan' has an incomplete definition:pydantic_settings.exceptions.IncompleteFieldDefinitionWarning",
]
